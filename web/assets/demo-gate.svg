<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" data-palette="e65671-e7966a-f6acd5-b4b01fb6a1d0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"><rect width="760" height="318" fill="#0a070e"/><rect x="24" y="24" width="712" height="274" rx="12" fill="#140d15" stroke="#3a1824" stroke-width="1.4"/><circle cx="52" cy="56" r="6" fill="#e65671" opacity="0.9"/><circle cx="76" cy="56" r="6" fill="#e7966a" opacity="0.9"/><circle cx="100" cy="56" r="6" fill="#f6acd5" opacity="0.9"/><text x="380" y="60" text-anchor="middle" font-size="12" fill="#b29cad">request_treatment · INV-1 gate</text><text x="48" y="88" font-size="13.5" fill="#fdeef7" xml:space="preserve">agent → dd-board: request_treatment { summary: "直接改缓存翻新顺序，先发版" }</text><text x="48" y="114" font-size="13.5" fill="#b29cad" xml:space="preserve"></text><text x="48" y="140" font-size="13.5" fill="#b29cad" xml:space="preserve">dd-board → agent:</text><text x="48" y="166" font-size="13.5" fill="#e65671" xml:space="preserve">治疗授权被拒绝（INV-1）：存在 2 条 untested 假设——h-1、h-2</text><text x="48" y="192" font-size="13.5" fill="#b29cad" xml:space="preserve">先对每条假设 record_probe_result 拿到 confirmed/refuted，</text><text x="48" y="218" font-size="13.5" fill="#b29cad" xml:space="preserve">绑不出探针的用 downgrade_hypothesis 降级，再重新申请治疗。</text></svg>
